---
- name: Validar CrowdStrike Falcon Sensor en Windows
  hosts: windows
  gather_facts: false

  tasks:

    - name: Obtener información del servicio Falcon
      ansible.windows.win_service_info:
        name: CSFalconService
      register: falcon_service

    - name: Definir resultado de validación
      ansible.builtin.set_fact:
        falcon_installed: "{{ falcon_service.services | length > 0 }}"

    - name: Mostrar resultado
      ansible.builtin.debug:
        msg: >-
          {% if falcon_installed %}
          OK - CrowdStrike Falcon Sensor está instalado.
          Estado del servicio: {{ falcon_service.services[0].state }}
          {% else %}
          FAILED - CrowdStrike Falcon Sensor no está instalado.
          {% endif %}
