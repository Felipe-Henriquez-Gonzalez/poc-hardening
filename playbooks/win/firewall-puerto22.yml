---
- name: Habilitar puerto 22 SSH en Windows Server 2025
  hosts: windows
  gather_facts: false

  tasks:

    - name: Habilitar puerto TCP 22 en Windows Firewall
      ansible.windows.win_firewall:
        name: "Allow SSH TCP 22"
        description: "Permitir conexiones SSH entrantes por TCP 22"
        localport: 22
        protocol: tcp
        direction: in
        action: allow
        state: present
        enabled: true
        profiles:
          - domain
          - private
          - public
