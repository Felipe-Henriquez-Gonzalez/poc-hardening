---
- name: Instalar CrowdStrike Falcon Sensor en Windows
  hosts: windows
  gather_facts: false

  vars:
    falcon_installer_path: 'C:\tmp\FalconSensor_Windows.exe'

  tasks:

    - name: Verificar que la variable falcon_cid esté definida
      ansible.builtin.assert:
        that:
          - falcon_cid is defined
          - falcon_cid | length > 0
        fail_msg: "La variable falcon_cid debe ser proporcionada externamente."

    - name: Verificar que exista el instalador de Falcon Sensor
      ansible.windows.win_stat:
        path: "{{ falcon_installer_path }}"
      register: falcon_installer

    - name: Detener ejecución si no existe el instalador
      ansible.builtin.fail:
        msg: "NO FUE INSTALADO CORRECTAMENTE - No se encontró el instalador."
      when: not falcon_installer.stat.exists

    - name: Instalar CrowdStrike Falcon Sensor
      ansible.windows.win_command: >
        "{{ falcon_installer_path }}"
        /install
        /quiet
        /norestart
        CID={{ falcon_cid }}
      register: falcon_install
      changed_when: falcon_install.rc in [0, 3010]
      failed_when: false

    - name: Verificar servicio CrowdStrike Falcon Sensor
      ansible.windows.win_service_info:
        name: CSFalconService
      register: falcon_service
      when: falcon_install.rc in [0, 3010]

    - name: Determinar resultado final
      ansible.builtin.set_fact:
        falcon_instalado_correctamente: >-
          {{
            falcon_install.rc in [0, 3010]
            and
            (falcon_service.exists | default(false))
          }}

    - name: Resultado final de instalación
      ansible.builtin.debug:
        msg: >-
          {% if falcon_instalado_correctamente %}
          CrowdStrike Falcon Sensor FUE INSTALADO CORRECTAMENTE
          {% else %}
          CrowdStrike Falcon Sensor NO FUE INSTALADO CORRECTAMENTE
          {% endif %}
