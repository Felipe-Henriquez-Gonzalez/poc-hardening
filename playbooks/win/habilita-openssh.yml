---
- name: Instalar y configurar OpenSSH en Windows Server 2025
  hosts: windows
  gather_facts: false

  tasks:

    - name: Verificar estado de OpenSSH Server
      ansible.windows.win_powershell:
        script: |
          $capability = Get-WindowsCapability -Online -Name "OpenSSH.Server~~~~0.0.1.0"
          $Ansible.Result = @{
              State = $capability.State.ToString()
          }
      register: openssh_status

    - name: Mostrar estado actual de OpenSSH
      ansible.builtin.debug:
        msg: "Estado de OpenSSH Server: {{ openssh_status.result.State }}"

    - name: Instalar OpenSSH Server si no está instalado
      ansible.windows.win_powershell:
        script: |
          $capability = Get-WindowsCapability -Online -Name "OpenSSH.Server~~~~0.0.1.0"

          if ($capability.State -ne "Installed") {
              Add-WindowsCapability -Online -Name "OpenSSH.Server~~~~0.0.1.0"
              $Ansible.Changed = $true
          }
          else {
              $Ansible.Changed = $false
          }

    - name: Configurar servicio sshd en automático y arrancado
      ansible.windows.win_service:
        name: sshd
        start_mode: auto
        state: started

    - name: Verificar existencia de regla Firewall OpenSSH
      ansible.windows.win_powershell:
        script: |
          $rule = Get-NetFirewallRule `
            -Name "OpenSSH-Server-In-TCP" `
            -ErrorAction SilentlyContinue

          if ($null -eq $rule) {
              New-NetFirewallRule `
                -Name "OpenSSH-Server-In-TCP" `
                -DisplayName "OpenSSH Server (sshd)" `
                -Enabled True `
                -Direction Inbound `
                -Protocol TCP `
                -Action Allow `
                -LocalPort 22

              $Ansible.Changed = $true
          }
          else {
              Enable-NetFirewallRule -Name "OpenSSH-Server-In-TCP"
              $Ansible.Changed = $false
          }

    - name: Esperar que SSH esté disponible en puerto 22
      ansible.windows.win_wait_for:
        port: 22
        state: started
        timeout: 30

    - name: Validar estado final del servicio SSH
      ansible.windows.win_powershell:
        script: |
          $service = Get-Service sshd

          $Ansible.Result = @{
              Service = $service.Name
              Status  = $service.Status.ToString()
              Startup = (Get-CimInstance Win32_Service `
                         -Filter "Name='sshd'").StartMode
          }
      register: ssh_final_status

    - name: Mostrar resultado final
      ansible.builtin.debug:
        var: ssh_final_status.result
