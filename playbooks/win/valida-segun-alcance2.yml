---
- name: Windows Security Configuration Assessment
  hosts: windows
  gather_facts: false

  vars:
    expected_max_local_admins: 1

  tasks:

    # ============================================================
    # 1. MICROSOFT DEFENDER
    # ============================================================

    - name: Revisar estado de Microsoft Defender
      ansible.windows.win_powershell:
        script: |
          $result = [ordered]@{}

          try {
              $status = Get-MpComputerStatus -ErrorAction Stop

              $result.DefenderAvailable = $true
              $result.AntivirusEnabled = $status.AntivirusEnabled
              $result.AntispywareEnabled = $status.AntispywareEnabled
              $result.RealTimeProtectionEnabled = $status.RealTimeProtectionEnabled
              $result.BehaviorMonitorEnabled = $status.BehaviorMonitorEnabled
              $result.IoavProtectionEnabled = $status.IoavProtectionEnabled
              $result.AntivirusSignatureLastUpdated = $status.AntivirusSignatureLastUpdated
          }
          catch {
              $result.DefenderAvailable = $false
              $result.Error = $_.Exception.Message
          }

          $result | ConvertTo-Json -Compress
      register: defender_raw
      changed_when: false

    - name: Procesar resultado de Defender
      ansible.builtin.set_fact:
        defender_status: "{{ defender_raw.output[0] | from_json }}"


    # ============================================================
    # 2. WINDOWS EVENT LOG
    # ============================================================

    - name: Revisar configuración de Windows Event Logs
      ansible.windows.win_powershell:
        script: |
          $logs = @(
              "System",
              "Security",
              "Application"
          )

          $result = @()

          foreach ($log in $logs) {

              try {
                  $config = Get-WinEvent -ListLog $log

                  $result += [PSCustomObject]@{
                      LogName       = $log
                      Enabled       = $config.IsEnabled
                      RecordCount   = $config.RecordCount
                      MaximumSizeMB = [math]::Round(
                          $config.MaximumSizeInBytes / 1MB, 2
                      )
                      LogMode       = $config.LogMode.ToString()
                  }
              }
              catch {
                  $result += [PSCustomObject]@{
                      LogName       = $log
                      Enabled       = $false
                      RecordCount   = 0
                      MaximumSizeMB = 0
                      LogMode       = "ERROR"
                      Error         = $_.Exception.Message
                  }
              }
          }

          $result | ConvertTo-Json -Compress
      register: eventlog_raw
      changed_when: false

    - name: Procesar configuración de Event Logs
      ansible.builtin.set_fact:
        eventlog_status: >-
          {{
            (
              [eventlog_raw.output[0] | from_json]
              if (eventlog_raw.output[0] | from_json) is mapping
              else (eventlog_raw.output[0] | from_json)
            )
          }}


    # ============================================================
    # 3. SYSLOG / LOG FORWARDING
    # ============================================================

    - name: Buscar servicios relacionados con Syslog o Log Forwarding
      ansible.windows.win_powershell:
        script: |
          $services = Get-Service | Where-Object {
              $_.Name -match 'nxlog|syslog|splunk|winlogbeat|filebeat|fluent|elastic' -or
              $_.DisplayName -match 'nxlog|syslog|splunk|winlogbeat|filebeat|fluent|elastic'
          }

          $result = @()

          if ($services) {

              foreach ($service in $services) {

                  $result += [PSCustomObject]@{
                      Name        = $service.Name
                      DisplayName = $service.DisplayName
                      Status      = $service.Status.ToString()
                      StartType   = $service.StartType.ToString()
                  }
              }
          }
          else {

              $result += [PSCustomObject]@{
                  Name        = "NOT_FOUND"
                  DisplayName = "No Syslog/Log Forwarder detected"
                  Status      = "N/A"
                  StartType   = "N/A"
              }
          }

          $result | ConvertTo-Json -Compress
      register: syslog_raw
      changed_when: false

    - name: Procesar Syslog / Log Forwarder
      ansible.builtin.set_fact:
        syslog_status: >-
          {{
            (
              [syslog_raw.output[0] | from_json]
              if (syslog_raw.output[0] | from_json) is mapping
              else (syslog_raw.output[0] | from_json)
            )
          }}


    # ============================================================
    # 4. SOFTWARE DE SEGURIDAD
    # ============================================================

    - name: Revisar software de seguridad instalado
      ansible.windows.win_powershell:
        script: |
          $paths = @(
              "HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*",
              "HKLM:\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*"
          )

          $software = Get-ItemProperty $paths -ErrorAction SilentlyContinue |
              Where-Object {
                  $_.DisplayName -match 'CrowdStrike|Falcon|Defender|Symantec|McAfee|Trellix|Sophos|Trend Micro|SentinelOne|Kaspersky|ESET|Carbon Black'
              } |
              Select-Object DisplayName, DisplayVersion, Publisher |
              Sort-Object DisplayName -Unique

          $result = @()

          if ($software) {

              foreach ($item in $software) {

                  $result += [PSCustomObject]@{
                      DisplayName    = $item.DisplayName
                      DisplayVersion = $item.DisplayVersion
                      Publisher      = $item.Publisher
                  }
              }
          }
          else {

              $result += [PSCustomObject]@{
                  DisplayName    = "NOT_FOUND"
                  DisplayVersion = "N/A"
                  Publisher      = "No third-party security software detected"
              }
          }

          $result | ConvertTo-Json -Compress
      register: security_software_raw
      changed_when: false

    - name: Procesar software de seguridad
      ansible.builtin.set_fact:
        security_software_status: >-
          {{
            (
              [security_software_raw.output[0] | from_json]
              if (security_software_raw.output[0] | from_json) is mapping
              else (security_software_raw.output[0] | from_json)
            )
          }}


    # ============================================================
    # 5. CROWDSTRIKE FALCON
    # ============================================================

    - name: Revisar específicamente CrowdStrike Falcon
      ansible.windows.win_powershell:
        script: |
          $service = Get-Service -Name CSFalconService -ErrorAction SilentlyContinue

          if ($service) {

              [PSCustomObject]@{
                  Installed   = $true
                  ServiceName = $service.Name
                  Status      = $service.Status.ToString()
                  StartType   = $service.StartType.ToString()
              } | ConvertTo-Json -Compress
          }
          else {

              [PSCustomObject]@{
                  Installed   = $false
                  ServiceName = "CSFalconService"
                  Status      = "NOT_FOUND"
                  StartType   = "N/A"
              } | ConvertTo-Json -Compress
          }
      register: crowdstrike_raw
      changed_when: false

    - name: Procesar CrowdStrike
      ansible.builtin.set_fact:
        crowdstrike_status: "{{ crowdstrike_raw.output[0] | from_json }}"


    # ============================================================
    # 6. CUENTA ADMINISTRATOR INTEGRADA
    # ============================================================

    - name: Revisar estado de cuenta Administrator integrada
      ansible.windows.win_powershell:
        script: |
          # RID 500 identifica la cuenta Administrator integrada,
          # independientemente del nombre o idioma de Windows.

          $admin = Get-LocalUser |
              Where-Object {
                  $_.SID.Value -match '-500$'
              }

          if ($admin) {

              [PSCustomObject]@{
                  Name        = $admin.Name
                  Enabled     = $admin.Enabled
                  SID         = $admin.SID.Value
                  LastLogon   = if ($admin.LastLogon) {
                      $admin.LastLogon.ToString()
                  } else {
                      "Nunca / No disponible"
                  }
                  Description = $admin.Description
              } | ConvertTo-Json -Compress
          }
          else {

              [PSCustomObject]@{
                  Name        = "NOT_FOUND"
                  Enabled     = $false
                  SID         = "N/A"
                  LastLogon   = "N/A"
                  Description = "Cuenta Administrator no encontrada"
              } | ConvertTo-Json -Compress
          }
      register: builtin_admin_raw
      changed_when: false

    - name: Procesar cuenta Administrator
      ansible.builtin.set_fact:
        builtin_admin_status: "{{ builtin_admin_raw.output[0] | from_json }}"


    # ============================================================
    # 7. MIEMBROS DEL GRUPO ADMINISTRATORS
    # ============================================================

    - name: Obtener miembros del grupo Administrators
      ansible.windows.win_powershell:
        script: |
          # SID S-1-5-32-544 corresponde al grupo local Administrators
          # independientemente del idioma de Windows.

          $group = Get-LocalGroup |
              Where-Object {
                  $_.SID.Value -eq "S-1-5-32-544"
              }

          $result = @()

          if ($group) {

              try {

                  $members = @(Get-LocalGroupMember -Group $group.Name)

                  foreach ($member in $members) {

                      $source = $member.PrincipalSource.ToString()

                      if ($source -eq "Local") {
                          $origin = "LOCAL"
                      }
                      elseif ($source -eq "ActiveDirectory") {
                          $origin = "DOMINIO"
                      }
                      else {
                          $origin = $source.ToUpper()
                      }

                      $result += [PSCustomObject]@{
                          Name            = $member.Name
                          ObjectClass     = $member.ObjectClass.ToString()
                          PrincipalSource = $source
                          Origin          = $origin
                      }
                  }
              }
              catch {

                  $result += [PSCustomObject]@{
                      Name            = "ERROR"
                      ObjectClass     = "N/A"
                      PrincipalSource = "N/A"
                      Origin          = "N/A"
                      Error           = $_.Exception.Message
                  }
              }
          }

          $result | ConvertTo-Json -Compress
      register: administrators_raw
      changed_when: false

    - name: Procesar miembros del grupo Administrators
      ansible.builtin.set_fact:
        administrators_status: >-
          {{
            (
              [administrators_raw.output[0] | from_json]
              if (administrators_raw.output[0] | from_json) is mapping
              else (administrators_raw.output[0] | from_json)
            )
          }}


    # ============================================================
    # 8. CONTAR ADMINISTRADORES
    # ============================================================

    - name: Contar administradores
      ansible.windows.win_powershell:
        script: |
          $group = Get-LocalGroup |
              Where-Object {
                  $_.SID.Value -eq "S-1-5-32-544"
              }

          if ($group) {

              $members = @(Get-LocalGroupMember -Group $group.Name)

              [PSCustomObject]@{
                  GroupName = $group.Name
                  Count     = $members.Count
              } | ConvertTo-Json -Compress
          }
          else {

              [PSCustomObject]@{
                  GroupName = "NOT_FOUND"
                  Count     = 0
              } | ConvertTo-Json -Compress
          }
      register: admin_count_raw
      changed_when: false

    - name: Procesar cantidad de administradores
      ansible.builtin.set_fact:
        admin_count: "{{ admin_count_raw.output[0] | from_json }}"


    # ============================================================
    # 9. CLASIFICAR USUARIOS Y GRUPOS ADMINISTRADORES
    # ============================================================

    - name: Inicializar listas de administradores
      ansible.builtin.set_fact:
        local_admin_users: []
        domain_admin_users: []
        local_admin_groups: []
        domain_admin_groups: []

    - name: Clasificar usuarios locales administradores
      ansible.builtin.set_fact:
        local_admin_users: "{{ local_admin_users + [item.Name] }}"
      loop: "{{ administrators_status }}"
      when:
        - item.ObjectClass | default('') | lower == 'user'
        - item.Origin | default('') == 'LOCAL'

    - name: Clasificar usuarios de dominio administradores
      ansible.builtin.set_fact:
        domain_admin_users: "{{ domain_admin_users + [item.Name] }}"
      loop: "{{ administrators_status }}"
      when:
        - item.ObjectClass | default('') | lower == 'user'
        - item.Origin | default('') == 'DOMINIO'

    - name: Clasificar grupos locales administradores
      ansible.builtin.set_fact:
        local_admin_groups: "{{ local_admin_groups + [item.Name] }}"
      loop: "{{ administrators_status }}"
      when:
        - item.ObjectClass | default('') | lower == 'group'
        - item.Origin | default('') == 'LOCAL'

    - name: Clasificar grupos de dominio administradores
      ansible.builtin.set_fact:
        domain_admin_groups: "{{ domain_admin_groups + [item.Name] }}"
      loop: "{{ administrators_status }}"
      when:
        - item.ObjectClass | default('') | lower == 'group'
        - item.Origin | default('') == 'DOMINIO'


    # ============================================================
    # 10. VERIFICAR EVENT LOGS HABILITADOS
    # ============================================================

    - name: Contar Event Logs habilitados
      ansible.builtin.set_fact:
        eventlogs_enabled_count: >-
          {{
            eventlog_status
            | selectattr('Enabled', 'equalto', true)
            | list
            | length
          }}


    # ============================================================
    # 11. INTERPRETAR DEFENDER
    # ============================================================

    - name: Interpretar resultado de Microsoft Defender
      ansible.builtin.set_fact:
        defender_result: >-
          {% if defender_status.DefenderAvailable | default(false) %}
            {% if defender_status.RealTimeProtectionEnabled | default(false) %}
            CORRECTO
            {% elif crowdstrike_status.Installed | default(false)
                  and crowdstrike_status.Status | default('') == 'Running' %}
            INFORMATIVO
            {% else %}
            REQUIERE ATENCION
            {% endif %}
          {% else %}
            {% if crowdstrike_status.Installed | default(false)
                  and crowdstrike_status.Status | default('') == 'Running' %}
            INFORMATIVO
            {% else %}
            REQUIERE REVISION
            {% endif %}
          {% endif %}

        defender_interpretacion: >-
          {% if defender_status.DefenderAvailable | default(false) %}
            {% if defender_status.RealTimeProtectionEnabled | default(false) %}
            Microsoft Defender está disponible y su protección en tiempo
            real se encuentra habilitada. El servidor dispone de protección
            antivirus activa mediante Microsoft Defender.
            {% elif crowdstrike_status.Installed | default(false)
                  and crowdstrike_status.Status | default('') == 'Running' %}
            Microsoft Defender está disponible pero la protección en tiempo
            real no está activa. Sin embargo, CrowdStrike Falcon está instalado
            y funcionando, por lo que este estado puede ser esperado cuando
            CrowdStrike actúa como solución principal de protección.
            {% else %}
            Microsoft Defender está disponible, pero la protección en tiempo
            real no está habilitada y no se detectó CrowdStrike Falcon
            funcionando. Se recomienda revisar la protección antivirus/EDR
            configurada en el servidor.
            {% endif %}
          {% else %}
            {% if crowdstrike_status.Installed | default(false)
                  and crowdstrike_status.Status | default('') == 'Running' %}
            Microsoft Defender no está disponible como antivirus activo,
            pero CrowdStrike Falcon está instalado y funcionando.
            El servidor dispone de una solución EDR activa.
            {% else %}
            No fue posible confirmar Microsoft Defender activo y tampoco
            se detectó CrowdStrike Falcon funcionando. Se recomienda validar
            qué solución de seguridad protege actualmente este servidor.
            {% endif %}
          {% endif %}


    # ============================================================
    # 12. INTERPRETAR CROWDSTRIKE
    # ============================================================

    - name: Interpretar resultado de CrowdStrike
      ansible.builtin.set_fact:
        crowdstrike_result: >-
          {% if crowdstrike_status.Installed | default(false)
                and crowdstrike_status.Status | default('') == 'Running' %}
          CORRECTO
          {% elif crowdstrike_status.Installed | default(false) %}
          REQUIERE ATENCION
          {% else %}
          INFORMATIVO
          {% endif %}

        crowdstrike_interpretacion: >-
          {% if crowdstrike_status.Installed | default(false)
                and crowdstrike_status.Status | default('') == 'Running' %}
          CrowdStrike Falcon está instalado y su servicio se encuentra
          actualmente en ejecución. El sensor está operativo a nivel
          de servicio Windows.
          {% elif crowdstrike_status.Installed | default(false) %}
          CrowdStrike Falcon está instalado, pero su servicio no se encuentra
          en ejecución. Se recomienda revisar el estado del sensor.
          {% else %}
          CrowdStrike Falcon no fue detectado en este servidor.
          Esto no necesariamente representa un incumplimiento si la
          organización utiliza otra solución antivirus o EDR.
          {% endif %}


    # ============================================================
    # 13. INTERPRETAR BUILT-IN ADMINISTRATOR
    # ============================================================

    - name: Interpretar cuenta Administrator integrada
      ansible.builtin.set_fact:
        builtin_admin_result: >-
          {% if builtin_admin_status.Name | default('NOT_FOUND') == 'NOT_FOUND' %}
          REQUIERE REVISION
          {% elif builtin_admin_status.Enabled | default(false) %}
          REQUIERE ATENCION
          {% else %}
          CORRECTO
          {% endif %}

        builtin_admin_interpretacion: >-
          {% if builtin_admin_status.Name | default('NOT_FOUND') == 'NOT_FOUND' %}
          No fue posible identificar correctamente la cuenta Administrator
          integrada de Windows. Se recomienda realizar una revisión manual.
          {% elif builtin_admin_status.Enabled | default(false) %}
          La cuenta Administrator integrada de Windows se encuentra habilitada.
          Esta cuenta posee privilegios elevados y se recomienda confirmar que
          exista una justificación para mantenerla activa.
          {% else %}
          La cuenta Administrator integrada de Windows se encuentra
          deshabilitada. Este estado reduce la exposición de una cuenta
          administrativa conocida.
          {% endif %}


    # ============================================================
    # 14. INTERPRETAR ADMINISTRADORES
    # ============================================================

    - name: Interpretar miembros del grupo Administrators
      ansible.builtin.set_fact:
        administrators_result: >-
          {% if (admin_count.Count | int) <= (expected_max_local_admins | int) %}
          CORRECTO
          {% else %}
          REQUIERE REVISION
          {% endif %}

        administrators_interpretacion: >-
          {% if (admin_count.Count | int) <= (expected_max_local_admins | int) %}
          El grupo {{ admin_count.GroupName }} contiene
          {{ admin_count.Count }} miembro(s). La cantidad se encuentra
          dentro del máximo esperado de {{ expected_max_local_admins }}.
          {% else %}
          El grupo {{ admin_count.GroupName }} contiene
          {{ admin_count.Count }} miembro(s), superando el valor de referencia
          definido de {{ expected_max_local_admins }}. Esto no significa
          necesariamente que exista un problema de seguridad, pero se recomienda
          confirmar que cada usuario y grupo tenga una necesidad justificada
          de privilegios administrativos.
          {% endif %}


    # ============================================================
    # 15. INTERPRETAR EVENT LOG
    # ============================================================

    - name: Interpretar Windows Event Logs
      ansible.builtin.set_fact:
        eventlog_result: >-
          {% if (eventlogs_enabled_count | int) == 3 %}
          CORRECTO
          {% else %}
          REQUIERE ATENCION
          {% endif %}

        eventlog_interpretacion: >-
          {% if (eventlogs_enabled_count | int) == 3 %}
          Los tres registros principales evaluados de Windows
          (System, Security y Application) se encuentran habilitados.
          El servidor mantiene disponibles sus principales fuentes
          de auditoría y diagnóstico.
          {% else %}
          Solo {{ eventlogs_enabled_count }} de los 3 registros principales
          evaluados se encuentran habilitados. Se recomienda revisar
          System, Security y Application.
          {% endif %}


    # ============================================================
    # 16. INTERPRETAR SYSLOG / LOG FORWARDER
    # ============================================================

    - name: Interpretar Log Forwarding
      ansible.builtin.set_fact:
        syslog_detected: >-
          {{
            (
              syslog_status
              | rejectattr('Name', 'equalto', 'NOT_FOUND')
              | list
              | length
            ) > 0
          }}

    - name: Crear interpretación de Log Forwarding
      ansible.builtin.set_fact:
        syslog_result: >-
          {% if syslog_detected | bool %}
          CORRECTO
          {% else %}
          INFORMATIVO
          {% endif %}

        syslog_interpretacion: >-
          {% if syslog_detected | bool %}
          Se detectó al menos una solución relacionada con centralización
          o envío de logs instalada en el servidor. Esto permite que los
          eventos puedan ser enviados hacia una plataforma externa de
          monitoreo o seguridad, dependiendo de su configuración.
          {% else %}
          No se detectó automáticamente un agente conocido de envío de logs
          como Splunk, NXLog, Winlogbeat, Filebeat, Fluent o Elastic.
          Esto no confirma que no exista centralización de logs, ya que
          podría utilizarse Windows Event Forwarding u otra tecnología
          no contemplada por esta validación.
          {% endif %}


    # ============================================================
    # 17. INTERPRETAR SOFTWARE DE SEGURIDAD
    # ============================================================

    - name: Determinar presencia de software de seguridad
      ansible.builtin.set_fact:
        security_software_detected: >-
          {{
            (
              security_software_status
              | rejectattr('DisplayName', 'equalto', 'NOT_FOUND')
              | list
              | length
            ) > 0
          }}

    - name: Interpretar software de seguridad
      ansible.builtin.set_fact:
        security_software_result: >-
          {% if security_software_detected | bool %}
          CORRECTO
          {% else %}
          REQUIERE REVISION
          {% endif %}

        security_software_interpretacion: >-
          {% if security_software_detected | bool %}
          Se detectó software de seguridad conocido instalado en el servidor.
          El detalle de las soluciones encontradas se muestra más abajo.
          {% else %}
          No se encontró software de seguridad de terceros dentro de las
          soluciones contempladas por esta validación. Esto no demuestra
          necesariamente que el servidor se encuentre sin protección,
          pero se recomienda confirmar la solución antivirus o EDR utilizada.
          {% endif %}


    # ============================================================
    # 18. CALCULAR CONTROLES QUE REQUIEREN ATENCION
    # ============================================================

    - name: Calcular cantidad de observaciones
      ansible.builtin.set_fact:
        cantidad_observaciones: >-
          {{
            (1 if defender_result | trim in ['REQUIERE ATENCION', 'REQUIERE REVISION'] else 0)
            +
            (1 if crowdstrike_result | trim in ['REQUIERE ATENCION', 'REQUIERE REVISION'] else 0)
            +
            (1 if builtin_admin_result | trim in ['REQUIERE ATENCION', 'REQUIERE REVISION'] else 0)
            +
            (1 if administrators_result | trim in ['REQUIERE ATENCION', 'REQUIERE REVISION'] else 0)
            +
            (1 if eventlog_result | trim in ['REQUIERE ATENCION', 'REQUIERE REVISION'] else 0)
            +
            (1 if security_software_result | trim in ['REQUIERE ATENCION', 'REQUIERE REVISION'] else 0)
          }}


    # ============================================================
    # 19. REPORTE FINAL PARA LECTURA HUMANA
    # ============================================================

    - name: Mostrar reporte final de seguridad
      ansible.builtin.debug:
        msg:

          - ""
          - "======================================================================"
          - "              REPORTE DE SEGURIDAD DEL SERVIDOR"
          - "======================================================================"
          - ""
          - "Servidor evaluado: {{ inventory_hostname }}"
          - ""

          # ------------------------------------------------------
          # MICROSOFT DEFENDER
          # ------------------------------------------------------

          - "----------------------------------------------------------------------"
          - "1. MICROSOFT DEFENDER"
          - "----------------------------------------------------------------------"

          - "Estado: {{ defender_result | trim }}"

          - "{{ defender_interpretacion | trim }}"

          - >-
            Antivirus habilitado:
            {{
              'Sí'
              if defender_status.AntivirusEnabled | default(false)
              else 'No'
            }}

          - >-
            Protección en tiempo real:
            {{
              'Sí'
              if defender_status.RealTimeProtectionEnabled | default(false)
              else 'No'
            }}

          - ""

          # ------------------------------------------------------
          # CROWDSTRIKE
          # ------------------------------------------------------

          - "----------------------------------------------------------------------"
          - "2. CROWDSTRIKE FALCON"
          - "----------------------------------------------------------------------"

          - "Estado: {{ crowdstrike_result | trim }}"

          - "{{ crowdstrike_interpretacion | trim }}"

          - >-
            Instalado:
            {{
              'Sí'
              if crowdstrike_status.Installed | default(false)
              else 'No'
            }}

          - "Estado del servicio: {{ crowdstrike_status.Status | default('N/A') }}"

          - ""

          # ------------------------------------------------------
          # EVENT LOG
          # ------------------------------------------------------

          - "----------------------------------------------------------------------"
          - "3. WINDOWS EVENT LOG"
          - "----------------------------------------------------------------------"

          - "Estado: {{ eventlog_result | trim }}"

          - "{{ eventlog_interpretacion | trim }}"

          - "Registros principales habilitados: {{ eventlogs_enabled_count }} de 3"

          - ""

          # ------------------------------------------------------
          # LOG FORWARDING
          # ------------------------------------------------------

          - "----------------------------------------------------------------------"
          - "4. ENVIO Y CENTRALIZACION DE LOGS"
          - "----------------------------------------------------------------------"

          - "Estado: {{ syslog_result | trim }}"

          - "{{ syslog_interpretacion | trim }}"

          - ""

          # ------------------------------------------------------
          # SECURITY SOFTWARE
          # ------------------------------------------------------

          - "----------------------------------------------------------------------"
          - "5. SOFTWARE DE SEGURIDAD"
          - "----------------------------------------------------------------------"

          - "Estado: {{ security_software_result | trim }}"

          - "{{ security_software_interpretacion | trim }}"

          - ""

          # ------------------------------------------------------
          # ADMINISTRATOR
          # ------------------------------------------------------

          - "----------------------------------------------------------------------"
          - "6. CUENTA ADMINISTRATOR INTEGRADA"
          - "----------------------------------------------------------------------"

          - "Estado: {{ builtin_admin_result | trim }}"

          - "{{ builtin_admin_interpretacion | trim }}"

          - "Cuenta identificada: {{ builtin_admin_status.Name }}"

          - >-
            Cuenta habilitada:
            {{
              'Sí'
              if builtin_admin_status.Enabled | default(false)
              else 'No'
            }}

          - ""

