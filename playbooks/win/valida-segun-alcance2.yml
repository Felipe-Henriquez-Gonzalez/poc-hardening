          # ------------------------------------------------------

          - "----------------------------------------------------------------------"
          - "7. PRIVILEGIOS ADMINISTRATIVOS"
          - "----------------------------------------------------------------------"

          - "Estado: {{ administrators_result | trim }}"

          - "{{ administrators_interpretacion | trim }}"

          - "Grupo administrativo: {{ admin_count.GroupName }}"

          - "Total de miembros: {{ admin_count.Count }}"

          - ""

          - "Usuarios locales con privilegios administrativos:"

          - >-
            {{
              local_admin_users | join(', ')
              if local_admin_users | length > 0
              else 'No se detectaron usuarios locales.'
            }}

          - ""

          - "Usuarios de dominio con privilegios administrativos:"

          - >-
            {{
              domain_admin_users | join(', ')
              if domain_admin_users | length > 0
              else 'No se detectaron usuarios de dominio individuales.'
            }}

          - ""

          - "Grupos locales con privilegios administrativos:"

          - >-
            {{
              local_admin_groups | join(', ')
              if local_admin_groups | length > 0
              else 'No se detectaron grupos locales.'
            }}

          - ""

          - "Grupos de dominio con privilegios administrativos:"

          - >-
            {{
              domain_admin_groups | join(', ')
              if domain_admin_groups | length > 0
              else 'No se detectaron grupos de dominio.'
            }}

          - ""

          # ------------------------------------------------------
          # RESUMEN
          # ------------------------------------------------------

          - "======================================================================"
          - "                        RESUMEN EJECUTIVO"
          - "======================================================================"
          - ""

          - >-
            {% if cantidad_observaciones | int == 0 %}
            RESULTADO GENERAL: CONFIGURACION SIN OBSERVACIONES RELEVANTES
            {% elif cantidad_observaciones | int <= 2 %}
            RESULTADO GENERAL: CONFIGURACION MAYORITARIAMENTE CORRECTA
            {% else %}
            RESULTADO GENERAL: CONFIGURACION REQUIERE REVISION
            {% endif %}

          - ""

          - "Controles que requieren revisión: {{ cantidad_observaciones }}"

          - ""

          - >-
            {% if cantidad_observaciones | int == 0 %}
            Los principales controles evaluados no presentan desviaciones
            relevantes. Las configuraciones revisadas muestran un estado
            consistente con una configuración de seguridad adecuada.
            {% elif cantidad_observaciones | int <= 2 %}
            El servidor presenta una configuración de seguridad
            mayoritariamente adecuada. Se identificaron algunas observaciones
            que deberían ser revisadas para confirmar que corresponden
            al diseño de seguridad definido por la organización.
            {% else %}
            Se identificaron varios controles que requieren revisión.
            Esto no implica necesariamente que el servidor se encuentre
            vulnerable, pero se recomienda analizar las observaciones
            identificadas antes de considerar la configuración conforme.
            {% endif %}

          - ""
