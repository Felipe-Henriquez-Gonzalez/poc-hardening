---
- name: Detectar todos los CVE y parches de seguridad disponibles en RHEL
  hosts: linux
  become: true
  gather_facts: true

  tasks:

    - name: Validar que el sistema sea RHEL
      ansible.builtin.assert:
        that:
          - ansible_distribution == "RedHat"
        fail_msg: >
          Este playbook está diseñado para Red Hat Enterprise Linux.
          Sistema detectado: {{ ansible_distribution }}

    - name: Actualizar metadata de repositorios
      ansible.builtin.command:
        cmd: dnf -q makecache
      changed_when: false

    - name: Obtener todos los security advisories pendientes
      ansible.builtin.command:
        cmd: dnf -q updateinfo list updates security
      register: security_updates
      changed_when: false
      failed_when: security_updates.rc not in [0, 100]

    - name: Mostrar security advisories detectados
      ansible.builtin.debug:
        var: security_updates.stdout_lines

    - name: Inicializar lista de paquetes
      ansible.builtin.set_fact:
        security_packages: []

    - name: Extraer paquetes asociados a security advisories
      ansible.builtin.set_fact:
        security_packages: >-
          {{
            security_packages +
            [item.split()[-1]]
          }}
      loop: "{{ security_updates.stdout_lines }}"
      when:
        - item | trim | length > 0
        - item is search("RHSA-")

    - name: Eliminar paquetes duplicados
      ansible.builtin.set_fact:
        security_packages: "{{ security_packages | unique | list }}"

    - name: Obtener detalle completo de los advisories
      ansible.builtin.command:
        cmd: dnf -q updateinfo info updates security
      register: security_updateinfo
      changed_when: false
      failed_when: false

    - name: Extraer todos los CVE detectados
      ansible.builtin.set_fact:
        detected_cves: >-
          {{
            security_updateinfo.stdout
            | regex_findall('CVE-[0-9]{4}-[0-9]+')
            | unique
            | list
          }}

    - name: Extraer todos los RHSA detectados
      ansible.builtin.set_fact:
        detected_rhsas: >-
          {{
            security_updateinfo.stdout
            | regex_findall('RHSA-[0-9]{4}:[0-9]+')
            | unique
            | list
          }}

    - name: Determinar si existen parches de seguridad pendientes
      ansible.builtin.set_fact:
        security_patches_required: "{{ security_packages | length > 0 }}"

    - name: Mostrar resumen
      ansible.builtin.debug:
        msg:
          - "=========================================="
          - "Host: {{ inventory_hostname }}"
          - "RHEL: {{ ansible_distribution_version }}"
          - "CVE detectados: {{ detected_cves | length }}"
          - "RHSA detectados: {{ detected_rhsas | length }}"
          - "Paquetes a actualizar: {{ security_packages | length }}"
          - "CVE: {{ detected_cves }}"
          - "RHSA: {{ detected_rhsas }}"
          - "Paquetes: {{ security_packages }}"
          - "=========================================="

    - name: Registrar resultado por host
      ansible.builtin.set_fact:
        host_security_patch_info:
          distribution: "{{ ansible_distribution }}"
          distribution_version: "{{ ansible_distribution_version }}"
          cves: "{{ detected_cves }}"
          rhsas: "{{ detected_rhsas }}"
          patches_required: "{{ security_patches_required }}"
          packages: "{{ security_packages }}"


- name: Crear plan global de parcheo para el Workflow
  hosts: localhost
  gather_facts: false

  tasks:

    - name: Inicializar plan
      ansible.builtin.set_fact:
        security_patch_plan_build: {}

    - name: Construir plan por servidor
      ansible.builtin.set_fact:
        security_patch_plan_build: >-
          {{
            security_patch_plan_build |
            combine({
              item: hostvars[item].host_security_patch_info
            })
          }}
      loop: "{{ groups['all'] }}"
      when:
        - item != 'localhost'
        - hostvars[item].host_security_patch_info is defined

    - name: Mostrar plan global
      ansible.builtin.debug:
        var: security_patch_plan_build

    - name: Publicar plan como artifact del Workflow
      ansible.builtin.set_stats:
        data:
          security_patch_plan: "{{ security_patch_plan_build }}"
        per_host: false
        aggregate: false
