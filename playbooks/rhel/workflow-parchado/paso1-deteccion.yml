---
- name: Detectar parches disponibles para un CVE en RHEL
  hosts: linux
  become: true
  gather_facts: true

  vars:
    # Debe ser entregado desde AAP, Survey o extra_vars
    # Ejemplo:
    # cve_id: CVE-2025-32462
    cve_id: "{{ cve_id }}"

  tasks:

    - name: Validar que el sistema sea Red Hat Enterprise Linux
      ansible.builtin.assert:
        that:
          - ansible_distribution == "RedHat"
        fail_msg: >
          Este playbook solamente está diseñado para Red Hat Enterprise Linux.
          Sistema detectado: {{ ansible_distribution }}
        success_msg: >
          Sistema RHEL {{ ansible_distribution_version }} detectado.

    - name: Validar formato del CVE
      ansible.builtin.assert:
        that:
          - cve_id is defined
          - cve_id | length > 0
          - cve_id is match("^CVE-[0-9]{4}-[0-9]+$")
        fail_msg: >
          Debe especificar un CVE válido.
          Ejemplo: CVE-2025-32462

    - name: Actualizar metadata de repositorios
      ansible.builtin.command:
        cmd: dnf -q makecache
      changed_when: false

    - name: Buscar actualizaciones disponibles que corrigen el CVE
      ansible.builtin.command:
        cmd: "dnf -q updateinfo list updates --cve {{ cve_id }}"
      register: cve_updateinfo
      changed_when: false
      failed_when: cve_updateinfo.rc not in [0, 100]

    - name: Mostrar información encontrada por DNF
      ansible.builtin.debug:
        var: cve_updateinfo.stdout_lines

    # La salida normalmente tiene formato:
    #
    # RHSA-2025:XXXX Important/Sec. package-version-release.arch
    #
    # Tomamos la última columna.

    - name: Inicializar lista de paquetes
      ansible.builtin.set_fact:
        cve_packages: []

    - name: Extraer paquetes asociados al CVE
      ansible.builtin.set_fact:
        cve_packages: >-
          {{
            cve_packages +
            [item.split()[-1]]
          }}
      loop: "{{ cve_updateinfo.stdout_lines }}"
      when:
        - item | trim | length > 0
        - item is search("RHSA-")

    - name: Eliminar duplicados
      ansible.builtin.set_fact:
        cve_packages: "{{ cve_packages | unique | list }}"

    - name: Determinar si existen parches
      ansible.builtin.set_fact:
        patches_required: "{{ (cve_packages | length) > 0 }}"

    - name: Mostrar resultado de análisis
      ansible.builtin.debug:
        msg:
          - "=============================================="
          - "Servidor: {{ inventory_hostname }}"
          - "CVE analizado: {{ cve_id }}"
          - "RHEL: {{ ansible_distribution_version }}"
          - "Parches requeridos: {{ patches_required }}"
          - "Cantidad de paquetes: {{ cve_packages | length }}"
          - "Paquetes: {{ cve_packages }}"
          - "=============================================="

    #
    # Guardamos la información del host para construir
    # posteriormente el artifact global.
    #

    - name: Crear información de parcheo del host
      ansible.builtin.set_fact:
        host_cve_patch_info:
          cve: "{{ cve_id }}"
          distribution: "{{ ansible_distribution }}"
          distribution_version: "{{ ansible_distribution_version }}"
          patches_required: "{{ patches_required }}"
          packages: "{{ cve_packages }}"


#
# Crear artifact global que será entregado al siguiente Job Template
#

- name: Crear plan de parcheo para el Workflow
  hosts: localhost
  gather_facts: false

  vars:
    cve_patch_plan_build: {}

  tasks:

    - name: Inicializar plan de parcheo
      ansible.builtin.set_fact:
        cve_patch_plan_build: {}

    - name: Construir plan por servidor
      ansible.builtin.set_fact:
        cve_patch_plan_build: >-
          {{
            cve_patch_plan_build |
            combine({
              item: hostvars[item].host_cve_patch_info
            })
          }}
      loop: "{{ groups['all'] }}"
      when:
        - item != 'localhost'
        - hostvars[item].host_cve_patch_info is defined

    - name: Mostrar plan completo de parcheo
      ansible.builtin.debug:
        var: cve_patch_plan_build

    - name: Publicar artifact para el siguiente paso del Workflow
      ansible.builtin.set_stats:
        data:
          cve_patch_plan: "{{ cve_patch_plan_build }}"
          cve_detected: "{{ cve_id }}"
        per_host: false
        aggregate: false
