---
- name: Aplicar parches previamente detectados para un CVE
  hosts: all
  become: true
  gather_facts: true

  tasks:

    - name: Validar que existe información del workflow
      ansible.builtin.assert:
        that:
          - cve_patch_plan is defined
        fail_msg: >
          No se recibió la variable cve_patch_plan desde el
          paso anterior del Workflow.

    - name: Obtener plan de parcheo correspondiente al servidor
      ansible.builtin.set_fact:
        server_patch_plan: >-
          {{
            cve_patch_plan[inventory_hostname]
            if inventory_hostname in cve_patch_plan
            else {}
          }}

    - name: Validar que el servidor tenga información de parcheo
      ansible.builtin.assert:
        that:
          - server_patch_plan | length > 0
        fail_msg: >
          No existe información de parcheo para
          {{ inventory_hostname }}.

    - name: Mostrar plan recibido
      ansible.builtin.debug:
        msg:
          - "Servidor: {{ inventory_hostname }}"
          - "CVE: {{ server_patch_plan.cve }}"
          - "Parches requeridos: {{ server_patch_plan.patches_required }}"
          - "Paquetes a instalar: {{ server_patch_plan.packages }}"

    - name: Aplicar paquetes que mitigan el CVE
      ansible.builtin.dnf:
        name: "{{ server_patch_plan.packages }}"
        state: present
        update_only: true
      register: patch_result
      when:
        - server_patch_plan.patches_required | bool
        - server_patch_plan.packages | length > 0

    - name: Mostrar resultado de instalación
      ansible.builtin.debug:
        var: patch_result
      when:
        - server_patch_plan.patches_required | bool
        - server_patch_plan.packages | length > 0

    - name: Informar que no se requieren actualizaciones
      ansible.builtin.debug:
        msg: >
          El servidor {{ inventory_hostname }}
          no requiere parches para {{ server_patch_plan.cve }}.
      when:
        - not server_patch_plan.patches_required | bool

    #
    # VALIDACIÓN POST-PARCHE
    #

    - name: Validar nuevamente el CVE después del parche
      ansible.builtin.command:
        cmd: >-
          dnf -q updateinfo list updates
          --cve {{ server_patch_plan.cve }}
      register: post_patch_check
      changed_when: false
      failed_when: false

    - name: Mostrar validación post-parche
      ansible.builtin.debug:
        msg:
          - "Servidor: {{ inventory_hostname }}"
          - "CVE: {{ server_patch_plan.cve }}"
          - "Actualizaciones pendientes:"
          - "{{ post_patch_check.stdout_lines }}"

    - name: Determinar si todavía existen parches pendientes
      ansible.builtin.set_fact:
        cve_still_vulnerable: >-
          {{
            post_patch_check.stdout_lines
            | select('search', 'RHSA-')
            | list
            | length > 0
          }}

    - name: Resultado final
      ansible.builtin.debug:
        msg: >-
          {% if cve_still_vulnerable %}
          ATENCION: todavía existen actualizaciones disponibles
          asociadas a {{ server_patch_plan.cve }}.
          {% else %}
          OK: no existen actualizaciones pendientes asociadas a
          {{ server_patch_plan.cve }}.
          {% endif %}

    - name: Registrar resultado final como artifact
      ansible.builtin.set_stats:
        data:
          cve_remediation_result:
            host: "{{ inventory_hostname }}"
            cve: "{{ server_patch_plan.cve }}"
            packages: "{{ server_patch_plan.packages }}"
            vulnerable_after_patch: "{{ cve_still_vulnerable }}"
